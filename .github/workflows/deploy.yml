name: Build and Deploy Lampa

on:
  push:
    branches:
      - rework
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Build Lampa
        run: npx gulp build_github

      - name: Prepare self-hosted template (no pre-installed plugins, no about page)
        run: |
          set -euo pipefail
          rm -rf ./build/github/lampa-main
          cp -R ./build/github/lampa ./build/github/lampa-main
          echo '[]' > ./build/github/lampa-main/autoload.json
          rm -f ./build/github/lampa-main/about.html

      - name: Prepare GitHub Pages build (replace MSX domain placeholders)
        env:
          MSX_DOMAIN: ${{ vars.MSX_DOMAIN }}
          MSX_PREFIX: ${{ vars.MSX_PREFIX }}
        run: |
          set -euo pipefail
          DOMAIN="${MSX_DOMAIN:-}"
          PREFIX="${MSX_PREFIX:-https://}"
          if [ -z "$DOMAIN" ] && [ -f "./index/github/CNAME" ]; then
            DOMAIN="$(tr -d '\r\n' < ./index/github/CNAME)"
          fi
          if [ -z "$DOMAIN" ]; then
            echo "MSX_DOMAIN is empty. Set repository variable MSX_DOMAIN or index/github/CNAME."
            exit 1
          fi
          rm -rf ./build/github/lampa-pages
          cp -R ./build/github/lampa ./build/github/lampa-pages
          sed -i \
            -e "s|{domain}|$DOMAIN|g" \
            -e "s|{PREFIX}|$PREFIX|g" \
            ./build/github/lampa-pages/msx/start.json
          grep -q '{domain}' ./build/github/lampa/msx/start.json
          grep -q '{PREFIX}' ./build/github/lampa/msx/start.json
          if grep -qE '\{domain\}|\{PREFIX\}' ./build/github/lampa-pages/msx/start.json; then
            echo "Placeholder replacement failed for gh-pages build."
            exit 1
          fi
          # gh-pages only: disable built-in extensions store (own Hub store is used).
          # NOTE: `gulp build_github` publishes ONLY app.min.js into build/github/lampa/
          # (public_github copies just dest/app.min.js), so patch whatever exists.
          for f in ./build/github/lampa-pages/app.min.js ./build/github/lampa-pages/app.js; do
            [ -f "$f" ] || continue
            sed -i -e 's/plugins_store:[[:space:]]*true/plugins_store:false/g' "$f"
          done
          # Verify patch applied to gh-pages bundle
          grep -Eq 'plugins_store:[[:space:]]*false' ./build/github/lampa-pages/app.min.js || { echo "gh-pages plugins_store patch failed (app.min.js)"; exit 1; }
          # Ensure self-hosted template (main branch) keeps the store enabled
          grep -Eq 'plugins_store:[[:space:]]*true' ./build/github/lampa-main/app.min.js || { echo "main branch unexpectedly lost plugins_store:true"; exit 1; }

      - name: Deploy self-hosted template branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/github/lampa-main/
          publish_branch: main

      - name: Deploy to GitHub Pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/github/lampa-pages/
          publish_branch: gh-pages

      - name: Prepare Cloudflare build (siaivo.tv, http only)
        env:
          CF_DOMAIN: siaivo.tv
        run: |
          set -euo pipefail
          rm -rf ./build/github/lampa-cf
          cp -R ./build/github/lampa ./build/github/lampa-cf
          cp ./build/github/lampa-pages/app.min.js ./build/github/lampa-cf/app.min.js
          sed -i \
            -e "s|{domain}|$CF_DOMAIN|g" \
            -e "s|{PREFIX}|http://|g" \
            ./build/github/lampa-cf/msx/start.json
          rm -f ./build/github/lampa-cf/CNAME
          # workers.dev off: the token is scoped to this Worker and can't read the account subdomain
          cat > ./build/github/wrangler-cf.json <<'JSON'
          {
            "name": "siaivo",
            "compatibility_date": "2026-10-01",
            "assets": { "directory": "./lampa-cf" },
            "workers_dev": false,
            "preview_urls": false
          }
          JSON

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --config ./build/github/wrangler-cf.json
