name: CI

on:
  pull_request:
  push:
    branches:
      - rework
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/ISSUE_TEMPLATE/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm test
      - run: npx gulp build_github
      - name: Check bundle is ES5
        run: npx --yes acorn@8 --ecma5 --silent ./build/github/lampa/app.min.js
